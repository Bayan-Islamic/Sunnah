name: bayan_sunnah
description: "Bayan Sunnah - an offline-first, ad-free Hadith reader from the Bayan Islamic Suite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Offline storage
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  share_plus: ^13.3.1
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Runs the real SQLite engine on the host so DatabaseHelper can be exercised
  # against the bundled asset database during `flutter test`.
  sqflite_common_ffi: ^2.3.6
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sunnah.db
